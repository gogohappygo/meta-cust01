# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-cust01"
BBFILE_PATTERN_meta-cust01 = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-cust01 = "6"

LAYERDEPENDS_meta-cust01 = "core"
LAYERSERIES_COMPAT_meta-cust01 = "scarthgap"

USER_CLASSES:append = " cust01-spdx-fix"
